<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>yt2009 Community Account</title><style>
body{margin:0;background:#eee;font:14px Arial,sans-serif;color:#333}header{background:#222;color:#fff;padding:14px max(16px,calc((100% - 900px)/2));font-size:20px}main{max-width:900px;margin:24px auto;padding:0 14px}.panel{background:#fff;border:1px solid #ccc;padding:18px;margin-bottom:16px;max-width:440px}h1{font-size:20px}h2{font-size:17px;margin-top:0}label{display:block;margin:12px 0 4px}input{box-sizing:border-box;width:100%;padding:9px;border:1px solid #aaa;font:14px Arial}button{margin-top:14px;padding:8px 12px;border:1px solid #888;background:#eee;cursor:pointer;font-weight:bold}#status{padding:10px 0;overflow-wrap:anywhere}
</style></head><body><header>yt2009 · Community</header><main>
<h1>Community account</h1><p>An account keeps your local favorites, playlists, subscriptions, comments and ratings when you return.</p><div id="status" role="status"></div>
<div style="display:flex;gap:18px;flex-wrap:wrap"><section class="panel"><h2>Sign in</h2><form id="login"><label for="login-user">Username</label><input id="login-user" name="username" minlength="3" maxlength="24" autocomplete="username" required pattern="[A-Za-z0-9_]{3,24}"><label for="login-pass">Password</label><input id="login-pass" name="password" type="password" autocomplete="current-password" required maxlength="256"><button>Sign in</button></form></section>
<section class="panel"><h2>Create account</h2><form id="register"><label for="reg-name">Display name (optional)</label><input id="reg-name" name="display_name" maxlength="32" autocomplete="nickname"><label for="reg-user">Username</label><input id="reg-user" name="username" minlength="3" maxlength="24" autocomplete="username" required pattern="[A-Za-z0-9_]{3,24}"><label for="reg-pass">Password (8+ characters)</label><input id="reg-pass" name="password" type="password" minlength="8" maxlength="256" autocomplete="new-password" required><button>Create account</button></form></section></div><p><a href="/">Back to yt2009</a></p></main>
<script>
(function(){"use strict";var status=document.getElementById("status");function submit(form,kind){form.addEventListener("submit",function(e){e.preventDefault();var button=form.querySelector("button");button.disabled=true;status.textContent="Please wait…";var values={};new FormData(form).forEach(function(v,k){values[k]=v;});fetch("/local-api/v1/accounts/"+kind,{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify(values)}).then(function(r){return r.json().then(function(d){if(!r.ok)throw new Error(d.error||"request_failed");return d;});}).then(function(d){status.textContent="Signed in as "+d.user.display_name+" (@"+d.user.username+").";window.location.href="/";}).catch(function(err){status.textContent="Could not "+(kind==="login"?"sign in":"create account")+": "+err.message.replace(/_/g," ");}).then(function(){button.disabled=false;});});}submit(document.getElementById("login"),"login");submit(document.getElementById("register"),"register");fetch("/local-api/v1/session",{credentials:"same-origin"}).then(function(r){return r.json();}).then(function(d){if(d.authenticated&&d.user)status.textContent="Already signed in locally as "+d.user.display_name+".";}).catch(function(){});})();
</script></body></html>
