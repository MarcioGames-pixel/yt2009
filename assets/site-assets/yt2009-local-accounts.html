<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>yt2009 Community Account</title><style>
body{margin:0;background:#eee;font:12px Arial,sans-serif;color:#333}header{background:#333;color:#fff;padding:13px max(16px,calc((100% - 900px)/2));font-size:21px;font-weight:bold;border-bottom:4px solid #c00}main{max-width:900px;margin:22px auto;padding:0 14px}.panel{background:#fff;border:1px solid #ccc;padding:16px;margin-bottom:16px;max-width:440px;box-shadow:0 1px 2px #ddd}h1{font-size:20px}h2{font-size:16px;margin-top:0;border-bottom:1px solid #ddd;padding-bottom:7px}label{display:block;margin:11px 0 4px}input,textarea{box-sizing:border-box;width:100%;padding:8px;border:1px solid #aaa;font:12px Arial}button{margin-top:12px;padding:7px 12px;border:1px solid #999;background:linear-gradient(#fff,#e8e8e8);cursor:pointer;font-weight:bold;color:#333}button:disabled{opacity:.55}#status{padding:10px 0;overflow-wrap:anywhere}.muted{color:#666}.hidden{display:none!important}.row{display:flex;gap:16px;flex-wrap:wrap}
</style></head><body><header>yt2009 <span style="font-weight:normal">Community</span></header><main>
<h1>Community account</h1><p>One local account for your profile, comments, ratings, favorites, playlists and subscriptions on this server.</p><div id="status" role="status" aria-live="polite"></div>
<div id="auth" class="row"><section class="panel"><h2>Sign in</h2><form id="login"><label for="login-user">Username or email</label><input id="login-user" name="username" autocomplete="username" required maxlength="254"><label for="login-pass">Password</label><input id="login-pass" name="password" type="password" autocomplete="current-password" required maxlength="256"><button>Sign in</button></form></section>
<section class="panel"><h2>Create account</h2><form id="register"><label for="reg-name">Display name</label><input id="reg-name" name="display_name" maxlength="32" autocomplete="nickname"><label for="reg-user">Username (3–24 letters, numbers or _)</label><input id="reg-user" name="username" minlength="3" maxlength="24" autocomplete="username" required pattern="[A-Za-z0-9_]{3,24}"><label for="reg-email">Email address</label><input id="reg-email" name="email" type="email" maxlength="254" autocomplete="email" required><label for="reg-pass">Password (8–256 characters)</label><input id="reg-pass" name="password" type="password" minlength="8" maxlength="256" autocomplete="new-password" required><button>Create account</button></form></section></div>
<section id="profile-panel" class="panel hidden" style="max-width:520px"><h2>Your profile</h2><p id="signed-in" class="muted"></p><form id="profile-form"><label for="profile-name">Display name</label><input id="profile-name" name="display_name" maxlength="32" required><label for="profile-bio">About you</label><textarea id="profile-bio" name="bio" rows="4" maxlength="500"></textarea><label for="profile-avatar">Avatar URL (HTTPS or local path)</label><input id="profile-avatar" name="avatar_url" maxlength="500" placeholder="/local-media/avatar.png"><button>Save profile</button></form><p><a id="public-profile" href="#">View public profile JSON</a></p><button id="logout" type="button">Sign out</button></section>
<p><a href="/">Back to yt2009</a></p></main>
<script>
(function(){"use strict";
var status=document.getElementById("status"),auth=document.getElementById("auth"),profilePanel=document.getElementById("profile-panel"),currentUser=null;
function api(path,method,values){return fetch("/local-api/v1"+path,{method:method||"GET",credentials:"same-origin",headers:values?{"Content-Type":"application/json"}:{},body:values?JSON.stringify(values):undefined}).then(function(r){return r.json().then(function(d){if(!r.ok)throw new Error(d.error||"request_failed");return d;});});}
function message(err,prefix){status.textContent=prefix+(err&&err.message?err.message.replace(/_/g," "):"unknown error");}
function showUser(user){currentUser=user;auth.classList.add("hidden");profilePanel.classList.remove("hidden");document.getElementById("signed-in").textContent="Signed in as "+user.display_name+" (@"+(user.username||"guest")+").";document.getElementById("profile-name").value=user.display_name||"";document.getElementById("profile-bio").value=user.bio||"";document.getElementById("profile-avatar").value=user.avatar_url||"";document.getElementById("public-profile").href="/u/"+encodeURIComponent(user.username||"");status.textContent=user.account?"Account loaded. Email verification is not enabled on this server.":"You are using a guest profile. Create or sign in to a named account to have a public profile.";}
function submit(form,kind){form.addEventListener("submit",function(e){e.preventDefault();var button=form.querySelector("button");button.disabled=true;status.textContent="Please wait…";var values={};new FormData(form).forEach(function(v,k){values[k]=v;});api("/accounts/"+kind,"POST",values).then(function(d){if(kind==="register")status.textContent=d.notice||"Account created.";return api("/accounts/me").then(function(me){showUser(me.user);});}).catch(function(err){message(err,"Could not "+(kind==="login"?"sign in":"create account")+": ");}).then(function(){button.disabled=false;});});}
submit(document.getElementById("login"),"login");submit(document.getElementById("register"),"register");
document.getElementById("profile-form").addEventListener("submit",function(e){e.preventDefault();var button=this.querySelector("button");button.disabled=true;api("/accounts/me","PATCH",{display_name:document.getElementById("profile-name").value,bio:document.getElementById("profile-bio").value,avatar_url:document.getElementById("profile-avatar").value}).then(function(d){showUser(d.user);status.textContent="Profile saved.";}).catch(function(err){message(err,"Could not save profile: ");}).then(function(){button.disabled=false;});});
document.getElementById("logout").addEventListener("click",function(){api("/accounts/logout","POST",{}).then(function(){currentUser=null;profilePanel.classList.add("hidden");auth.classList.remove("hidden");status.textContent="Signed out.";}).catch(function(err){message(err,"Could not sign out: ");});});
api("/accounts/me").then(function(d){showUser(d.user);}).catch(function(){api("/session").then(function(d){if(d.authenticated&&d.user)showUser(d.user);}).catch(function(){});});
})();</script></body></html>
