<!DOCTYPE html>
<html lang="en"><head><meta http-equiv="content-type" content="text/html; charset=UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YouTube - Reset password</title>
<link rel="stylesheet" href="/assets/site-assets/signin-css.css">
<style>#reset-main{width:760px;max-width:94%;margin:18px auto;font:13px Arial;color:#333}.reset-title{font-size:19px;font-weight:bold;border-bottom:1px solid #999;padding:6px 0}.reset-box{margin:20px auto;background:#e8eefa;border:1px solid #c3d9ff;padding:18px;max-width:480px}.reset-box label{display:block;font-weight:bold;margin:12px 0 5px}.reset-box input{padding:6px;width:100%;box-sizing:border-box}.reset-box button{margin-top:14px;padding:6px 14px;color:#039;font-weight:bold}#msg{overflow-wrap:anywhere}</style></head><body>
<div id="main"><div id="masthead-container"><div id="masthead"><a href="/" class="logo"><img src="/assets/site-assets/pixel-vfl73.gif" alt="YouTube" border="0"></a><div id="masthead-main"><div id="masthead-search"><form class="search-form" action="/results" method="get" name="searchForm"><div class="search-wrapper"><input class="search-term" name="search_query" type="text" maxlength="128"><a class="yt-button yt-button-primary" href="#" onclick="document.searchForm.submit();return false"><span>Search</span></a></div></form></div><div id="masthead-nav-main"><a href="/">Home</a><a href="/videos">Videos</a><a href="/channels">Channels</a></div></div><div style="float:right;padding-top:8px"><a href="/local-account">Sign in</a></div><div style="clear:both"></div></div></div>
<div id="reset-main"><div class="reset-title">Reset your password</div><section class="reset-box"><p>Enter a new password for your yt2009 account.</p><form id="reset"><label for="password">New password (8–256 characters)</label><input id="password" type="password" minlength="8" maxlength="256" required autocomplete="new-password"><button type="submit">Set new password</button></form><p id="msg" role="status"></p><a href="/local-account">Back to sign in</a></section></div></div>
<script>(function(){var form=document.getElementById("reset"),msg=document.getElementById("msg");form.addEventListener("submit",function(e){e.preventDefault();var token=new URLSearchParams(location.search).get("token")||"";var button=form.querySelector("button");button.disabled=true;fetch("/local-api/v1/accounts/reset-password",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token:token,password:document.getElementById("password").value})}).then(function(r){return r.json().then(function(d){if(!r.ok)throw Error(d.error||"reset_failed");return d;});}).then(function(d){msg.textContent=d.notice;form.hidden=true;}).catch(function(e){msg.textContent=e.message.replace(/_/g," ");}).then(function(){button.disabled=false;});});})();</script></body></html>
