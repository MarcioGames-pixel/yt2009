<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>yt2009 - Reset password</title><style>body{font:12px Arial;color:#333;background:#eee;margin:0}header{background:#333;color:#fff;padding:14px;border-bottom:4px solid #c00;font-size:20px}main{max-width:600px;margin:24px auto;background:#fff;border:1px solid #ccc;padding:18px}label{display:block;margin:12px 0}input{display:block;width:100%;box-sizing:border-box;padding:8px}button{padding:8px 12px}#msg{overflow-wrap:anywhere}</style></head><body><header>yt2009 · Account recovery</header><main><h1>Reset password</h1><form id="reset"><label>New password (8–256 characters)<input id="password" type="password" minlength="8" maxlength="256" required autocomplete="new-password"></label><button>Set new password</button></form><p id="msg" role="status"></p><a href="/local-account">Back to sign in</a></main><script>(function(){var form=document.getElementById("reset"),msg=document.getElementById("msg");form.addEventListener("submit",function(e){e.preventDefault();var token=new URLSearchParams(location.search).get("token")||"";fetch("/local-api/v1/accounts/reset-password",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token:token,password:document.getElementById("password").value})}).then(function(r){return r.json().then(function(d){if(!r.ok)throw Error(d.error||"reset_failed");return d;});}).then(function(d){msg.textContent=d.notice;form.hidden=true;}).catch(function(e){msg.textContent=e.message.replace(/_/g," ");});});})();</script></body></html>
