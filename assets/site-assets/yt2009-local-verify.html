<!DOCTYPE html>
<html lang="en"><head><meta http-equiv="content-type" content="text/html; charset=UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YouTube - Verify your email</title><link rel="stylesheet" href="/assets/site-assets/signin-css.css">
<style>#verify-main{width:760px;max-width:94%;margin:18px auto;font:13px Arial;color:#333}.verify-title{font-size:19px;font-weight:bold;border-bottom:1px solid #999;padding:6px 0}.verify-box{margin:20px auto;background:#e8eefa;border:1px solid #c3d9ff;padding:18px;max-width:480px;overflow-wrap:anywhere}</style></head><body>
<div id="main"><div id="masthead-container"><div id="masthead"><a href="/" class="logo"><img src="/assets/site-assets/pixel-vfl73.gif" alt="YouTube" border="0"></a><div id="masthead-main"><div id="masthead-search"><form class="search-form" action="/results" method="get" name="searchForm"><div class="search-wrapper"><input class="search-term" name="search_query" type="text" maxlength="128"><a class="yt-button yt-button-primary" href="#" onclick="document.searchForm.submit();return false"><span>Search</span></a></div></form></div><div id="masthead-nav-main"><a href="/">Home</a><a href="/videos">Videos</a><a href="/channels">Channels</a></div></div><div style="float:right;padding-top:8px"><a href="/local-account">Sign in</a></div><div style="clear:both"></div></div></div>
<div id="verify-main"><div class="verify-title">Verify your email address</div><section class="verify-box"><p id="verify-message" role="status">Checking your verification link...</p><a href="/local-account">Continue to yt2009 sign in</a></section></div></div>
<script>(function(){var out=document.getElementById("verify-message"),token=new URLSearchParams(location.search).get("token")||"";if(!token){out.textContent="This verification link is missing its token.";return;}fetch("/local-api/v1/accounts/verify?token="+encodeURIComponent(token),{credentials:"same-origin"}).then(function(r){return r.json().then(function(d){if(!r.ok)throw Error(d.error||"verification_failed");return d;});}).then(function(d){out.textContent=d.notice||"Email verified. You can now sign in.";}).catch(function(e){out.textContent=e.message.replace(/_/g," ");});})();</script></body></html>
