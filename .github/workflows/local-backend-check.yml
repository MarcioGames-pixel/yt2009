name: Local backend syntax checks

on:
  push:
    branches:
      - feature/independent-local-backend
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check changed backend JavaScript syntax
        run: |
          node --check back/yt2009localapi.js
          node --check back/yt2009communityapi.js
          node --check back/yt2009localpages.js
          node --check back/yt2009search.js
          node --check back/backend.js
          node --check assets/site-assets/yt2009-local-community.js
          node --check test/local-api.test.js
          node --check test/community-api.test.js
          node --check test/local-pages.test.js
          node --check test/community-ui.test.js
      - name: Run local API smoke tests
        run: npm test
